[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "liwm"
version = "0.4.0"
description = "LIWM - Latent Intent World Model: a persistent, evidence-based intent-learning layer for coding agents."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vyas Devgna" }]
keywords = [
  "agent", "claude-code", "codex", "intent", "personalization",
  "user-model", "agent-skills", "local-first",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
# Zero runtime dependencies is a hard design constraint: LIWM must run wherever
# the host agent runs without adding a dependency stack.
dependencies = []

[project.optional-dependencies]
# Zero *runtime* dependencies is the promise. It is a promise about what you
# install to use LIWM, not an argument against tools that catch bugs before a
# user does. Nothing here is imported by the package.
dev = ["ruff>=0.6", "coverage[toml]>=7.4"]

[project.urls]
Homepage = "https://github.com/vyas-devgna/liwm-agent-framework"
Repository = "https://github.com/vyas-devgna/liwm-agent-framework"
Issues = "https://github.com/vyas-devgna/liwm-agent-framework/issues"
Changelog = "https://github.com/vyas-devgna/liwm-agent-framework/blob/main/CHANGELOG.md"

[project.scripts]
liwm = "liwm.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/liwm/schemas" = ["schemas/*.json"]
"share/liwm" = ["INSTALL_PROMPT.md", "UPDATE_PROMPT.md", "UNINSTALL_PROMPT.md"]
"share/liwm/adapters/blocks" = ["adapters/blocks/*.md"]
"share/liwm/adapters/claude-code" = ["adapters/claude-code/*.md"]
"share/liwm/adapters/codex" = ["adapters/codex/*.md"]
"share/liwm/adapters/generic-agent" = ["adapters/generic-agent/*.md"]
"share/liwm/skills/liwm" = ["skills/liwm/SKILL.md"]
"share/liwm/skills/liwm/references" = ["skills/liwm/references/*.md"]
"share/liwm/skills/liwm-counterfactual" = ["skills/liwm-counterfactual/SKILL.md"]
"share/liwm/skills/liwm-evaluation" = ["skills/liwm-evaluation/SKILL.md"]
"share/liwm/skills/liwm-feedback" = ["skills/liwm-feedback/SKILL.md"]
"share/liwm/skills/liwm-intent-discovery" = ["skills/liwm-intent-discovery/SKILL.md"]
"share/liwm/skills/liwm-learning" = ["skills/liwm-learning/SKILL.md"]
"share/liwm/skills/liwm-onboarding" = ["skills/liwm-onboarding/SKILL.md"]
"share/liwm/skills/liwm-privacy" = ["skills/liwm-privacy/SKILL.md"]
"share/liwm/skills/liwm-profile" = ["skills/liwm-profile/SKILL.md"]
"share/liwm/skills/liwm-profile-maintenance" = ["skills/liwm-profile-maintenance/SKILL.md"]
"share/liwm/skills/liwm-project-intent" = ["skills/liwm-project-intent/SKILL.md"]
"share/liwm/skills/liwm-question-planner" = ["skills/liwm-question-planner/SKILL.md"]
"share/liwm/skills/liwm-retrospective" = ["skills/liwm-retrospective/SKILL.md"]
"share/liwm/skills/liwm-self-improvement" = ["skills/liwm-self-improvement/SKILL.md"]
"share/liwm/skills/liwm-traceability" = ["skills/liwm-traceability/SKILL.md"]
"share/liwm/benchmarks/intentbench/cases" = ["benchmarks/intentbench/cases/*.json"]

# Development tooling. LIWM's *runtime* dependency count is zero and stays
# zero; that is a promise about what you install to use it, not an argument
# against tools that catch bugs before you do.
#
# The rule set is deliberately narrow. `ruff --select ALL` reports 660 findings
# here, 493 of which are "use an f-string instead of %". This codebase uses %
# formatting throughout and that is a decision, not a defect; churning 493
# lines to satisfy a linter's taste would bury the findings that matter.
# Selected: real errors, undefined names, unused code, and likely bugs.
[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "W", "PLW", "RUF010", "RUF100"]
ignore = [
    "B008",     # a default computed once at import is sometimes the point
    "PLW2901",  # rebinding a loop variable is clearer than inventing a name
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assertRaises-style asserts are the test

[tool.coverage.run]
branch = true
source = ["src/liwm"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
